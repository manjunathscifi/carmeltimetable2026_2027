<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carmel College Classroom Schedule Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            background: white;
        }

        h1 {
            color: white;
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            line-height: 1.3;
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
        }

        .filters {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 1fr 1.2fr 1.5fr;
            gap: 12px;
            margin-bottom: 15px;
            overflow-x: hidden;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            line-height: 1.3;
        }

        .filter-group input,
        .filter-group select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
            width: 100%;
            max-width: 100%;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            min-width: 0;
            box-sizing: border-box;
            height: auto;
            min-height: 44px;
            line-height: 1.4;
        }

        .filter-group input[type="text"] {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding-left: 42px;
            padding-right: 15px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 2;
            line-height: 1;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-pill {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .clear-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: #ee5a5a;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
        }

        .results-container {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .results-header h2 {
            color: #333;
            font-size: 1.3rem;
        }

        .count-badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s;
        }

        thead th:hover {
            background: linear-gradient(135deg, #5a6fd6, #6a4190);
        }

        thead th .sort-icon {
            margin-left: 5px;
            opacity: 0.7;
        }

        tbody tr {
            border-bottom: 1px solid #eee;
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.01);
            box-shadow: 0 2px 10px rgba(102,126,234,0.1);
        }

        tbody td {
            padding: 12px 15px;
            color: #444;
        }

        .day-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .day-monday { background: #e3f2fd; color: #1565c0; }
        .day-tuesday { background: #f3e5f5; color: #7b1fa2; }
        .day-wednesday { background: #e8f5e9; color: #2e7d32; }
        .day-thursday { background: #fff3e0; color: #e65100; }
        .day-friday { background: #fce4ec; color: #c2185b; }
        .day-saturday { background: #e0f2f1; color: #00695c; }

        .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #555;
        }

        .room-tag {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .subject-text {
            font-weight: 500;
            color: #333;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .no-results h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .view-btn {
            padding: 10px 25px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        .view-btn:hover:not(.active) {
            background: #f0f0ff;
        }

        /* Grid View Styles */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .schedule-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .schedule-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.15);
            border-color: #667eea;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-room {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1rem;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555;
            font-size: 0.9rem;
        }

        .card-row strong {
            color: #333;
            min-width: 50px;
        }

        .hidden { display: none !important; }

        /* ===== MOBILE RESPONSIVE FIXES ===== */
        @media (max-width: 1100px) {
            .filter-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .filter-group:nth-child(1) { grid-column: span 3; }
            .filter-group:nth-child(5) { grid-column: span 2; }
        }

        @media (max-width: 768px) {
            body { padding: 10px; }

            .logo {
                width: 70px;
                height: 70px;
            }

            h1 {
                font-size: 1.4rem;
                padding: 0 10px;
            }

            .subtitle {
                font-size: 0.95rem;
                padding: 0 10px;
            }

            .filters {
                padding: 15px;
                border-radius: 12px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .filter-group:nth-child(1) { grid-column: 1; }
            .filter-group:nth-child(2) { grid-column: 1; }
            .filter-group:nth-child(3) { grid-column: 1; }
            .filter-group:nth-child(4) { grid-column: 1; }
            .filter-group:nth-child(5) { grid-column: 1; }

            .filter-group input,
            .filter-group select {
                padding: 12px 15px;
                font-size: 1rem;
                -webkit-appearance: none;
                appearance: none;
                height: auto;
                min-height: 48px;
                line-height: 1.4;
            }

            .stats-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .stat-pill {
                text-align: center;
                font-size: 0.9rem;
            }

            .clear-btn {
                width: 100%;
                padding: 14px;
                font-size: 1rem;
            }

            .results-container {
                padding: 15px;
                border-radius: 12px;
            }

            .results-header {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .results-header h2 {
                font-size: 1.1rem;
                text-align: center;
            }

            /* View toggle buttons - FIXED for mobile */
            .view-toggle {
                display: flex;
                width: 100%;
                gap: 8px;
            }

            .view-btn {
                flex: 1;
                padding: 12px 10px;
                font-size: 0.95rem;
                text-align: center;
                white-space: nowrap;
            }

            .count-badge {
                text-align: center;
                display: block;
                width: 100%;
            }

            table {
                font-size: 0.85rem;
            }

            thead th {
                padding: 10px 8px;
                font-size: 0.8rem;
            }

            tbody td {
                padding: 10px 8px;
            }

            .day-badge {
                font-size: 0.7rem;
                padding: 3px 8px;
            }

            .room-tag {
                font-size: 0.7rem;
                padding: 3px 8px;
                border-radius: 2px;
            }

            .grid-view {
                grid-template-columns: 1fr;
            }

            .schedule-card {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.2rem;
            }

            .view-btn {
                padding: 10px 8px;
                font-size: 0.85rem;
            }

            .filter-group label {
                font-size: 0.8rem;
            }
        }
            /* Fix for long dropdown text */
        select option {
            font-size: 0.85rem;
            padding: 5px;
        }

        /* Ensure filter grid doesn't overflow */
        .filters {
            overflow-x: hidden;
        }

        /* Make sure the subject filter specifically handles overflow */
        #subjectFilter {
            font-size: 0.9rem;
        }
    </style>
</head>

            function fallbackToLocal() {
                let count = parseInt(localStorage.getItem('carmelLocalCount') || '0');
                if (!alreadyCounted) {
                    count++;
                    localStorage.setItem('carmelLocalCount', count);
                    sessionStorage.setItem(sessionKey, 'true');
                }
                displayEl.textContent = count.toLocaleString();
            }

            function tryFetch(urlIndex) {
                if (urlIndex >= COUNTER_URLS.length) {
                    fallbackToLocal();
                    return;
                }

                const url = COUNTER_URLS[urlIndex];

                fetch(url, { 
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                })
                .then(function(response) {
                    if (!response.ok) throw new Error('Status: ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    const count = data.value !== undefined ? data.value : data.count;
                    if (count !== undefined && count !== null) {
                        animateCount(count);
                        localStorage.setItem('carmelLocalCount', count);
                        if (!alreadyCounted) {
                            sessionStorage.setItem(sessionKey, 'true');
                        }
                    } else {
                        throw new Error('Invalid count data');
                    }
                })
                .catch(function(err) {
                    console.log('Counter API ' + (urlIndex + 1) + ' failed:', err.message);
                    tryFetch(urlIndex + 1);
                });
            }

            // Start fetching
            tryFetch(0);
        })();
    </script>
</body>
</html>
